# =============================================================================
# IDENTITY — single source of truth for public profile identity / contact info
# =============================================================================
#
# Edit this file, push, and every consumer README re-renders within 24h
# (or instantly with: gh workflow run sync-identity.yml --repo <repo>).
#
# In a README, anything between matching markers gets replaced:
#   <!-- IDENTITY:<key> -->
#   ...auto-generated...
#   <!-- /IDENTITY:<key> -->
#
# -----------------------------------------------------------------------------
# AVAILABLE KEYS
# -----------------------------------------------------------------------------
#
# Linkified (custom-formatted markdown links):
#   email          →  [rensley@nfteria.cc](mailto:rensley@nfteria.cc)
#   x              →  [@VyperPilledDev](https://x.com/VyperPilledDev)
#   linkedin       →  [linkedin.com/in/<slug>](https://linkedin.com/in/<slug>)   (empty if linkedin_path unset)
#   github         →  [@doble196](https://github.com/doble196)
#   website        →  [nfteria.click](https://nfteria.click)
#
# Composite blocks (multi-line):
#   contact        →  email + X + linkedin (if set) + github + location, as a bullet list
#   fleet_table    →  | App | Domain | Role |  markdown table from `fleet:` below
#   fleet_links    →  bullet list of projects with links
#
# Any other top-level scalar (string / number / boolean) auto-renders as-is.
# Structured fields (lists / maps) need a custom renderer in sync-identity.py.
#
# =============================================================================

