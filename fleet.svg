<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 486" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="-5%" r="80%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.10"/>
      <stop offset="55%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ghGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="840" height="486" fill="#0b0f17"/>
  <rect width="840" height="486" fill="url(#bgGlow)"/>

  <!-- kicker -->
  <text x="40" y="37" font-size="10.5" letter-spacing="2.4" font-weight="600" fill="#5b6478">ONE IDENTITY · ONE PAYMENTS RAIL · A FLEET ON TOP</text>

  <!-- legend -->
  <line x1="690" y1="26" x2="720" y2="26" stroke="#22c55e" stroke-width="2.6" stroke-linecap="round"/>
  <text x="728" y="30" font-size="11" fill="#8b94a7">auth</text>
  <line x1="690" y1="45" x2="720" y2="45" stroke="#3b82f6" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="4 3"/>
  <text x="728" y="49" font-size="11" fill="#8b94a7">payments</text>

  <!-- auth spines: GitHat powers everything above it -->
  <g stroke="#22c55e" stroke-width="2" opacity="0.5">
    <line x1="147" y1="158" x2="147" y2="366"/>
    <line x1="420" y1="158" x2="420" y2="366"/>
    <line x1="693" y1="158" x2="693" y2="366"/>
  </g>

  <!-- GitHat — the identity foundation -->
  <ellipse cx="420" cy="409" rx="410" ry="150" fill="url(#ghGlow)"/>
  <rect x="60" y="366" width="720" height="86" rx="15" fill="#0c1a12" stroke="#22c55e" stroke-width="2.2"/>
  <text x="420" y="403" text-anchor="middle" font-size="19" font-weight="700" fill="#edf4ee">🎩  GitHat</text>
  <text x="420" y="426" text-anchor="middle" font-size="12" fill="#7d9b86">identity layer — one sign-in for the whole fleet</text>

  <!-- Sebastn — the payments rail -->
  <rect x="268" y="220" width="304" height="86" rx="14" fill="#0c1322" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="420" y="257" text-anchor="middle" font-size="16.5" font-weight="700" fill="#eef1f8">💳  Sebastn</text>
  <text x="420" y="279" text-anchor="middle" font-size="11.5" fill="#7e8aa6">payments rail · connected accounts</text>

  <!-- the fleet -->
  <rect x="38" y="64" width="218" height="94" rx="14" fill="#111229" stroke="#7c8cff" stroke-width="1.6"/>
  <text x="147" y="109" text-anchor="middle" font-size="16" font-weight="700" fill="#eef1f8">📅  ClickReserv</text>
  <text x="147" y="130" text-anchor="middle" font-size="11" fill="#8b94a7">booking SaaS</text>

  <rect x="311" y="64" width="218" height="94" rx="14" fill="#1f1606" stroke="#ff8a3d" stroke-width="1.6"/>
  <text x="420" y="109" text-anchor="middle" font-size="16" font-weight="700" fill="#f8f1e9">📊  Quantl</text>
  <text x="420" y="130" text-anchor="middle" font-size="11" fill="#a79480">quant signals</text>

  <rect x="584" y="64" width="218" height="94" rx="14" fill="#220e10" stroke="#ff5a5f" stroke-width="1.6"/>
  <text x="693" y="109" text-anchor="middle" font-size="16" font-weight="700" fill="#f8eded">🛒  Colmado</text>
  <text x="693" y="130" text-anchor="middle" font-size="11" fill="#a78589">commerce</text>

  <!-- auth connection nodes -->
  <g fill="#22c55e">
    <circle cx="147" cy="158" r="3.2"/><circle cx="420" cy="158" r="3.2"/><circle cx="693" cy="158" r="3.2"/>
    <circle cx="147" cy="366" r="3.2"/><circle cx="420" cy="366" r="3.2"/><circle cx="693" cy="366" r="3.2"/>
  </g>

  <!-- payments: Sebastn -> ClickReserv + Quantl (Colmado has none) -->
  <g stroke="#3b82f6" stroke-width="2" stroke-dasharray="5 4" fill="none">
    <path d="M 348 220 L 207 158"/>
    <path d="M 470 220 L 452 158"/>
  </g>
  <g fill="#3b82f6">
    <circle cx="348" cy="220" r="3.2"/><circle cx="207" cy="158" r="3.2"/>
    <circle cx="470" cy="220" r="3.2"/><circle cx="452" cy="158" r="3.2"/>
  </g>
</svg>
